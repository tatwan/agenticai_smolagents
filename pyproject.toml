[project]
name = "smolagents-course"
version = "0.1.0"
description = "Building AI Agents with smolagents — Mini-Course"
requires-python = ">=3.10"
dependencies = [
    "smolagents[litellm]>=1.0.0",
    "huggingface-hub>=0.23.0",
    "mlflow>=2.13.0",
    "duckduckgo-search>=6.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
